apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: { app: backend }
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  selector: { matchLabels: { app: backend } }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.registry }}/backend:{{ .Values.image.tag }}"
          ports: [{ name: http, containerPort: 8000 }]
          envFrom: [{ secretRef: { name: db-credentials } }]
          env:
            - { name: ENABLE_STRESS, value: {{ .Values.enableStress | quote }} }
          readinessProbe: { httpGet: { path: /api/health, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /api/health, port: http }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: { app: backend }
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
spec:
  selector: { app: backend }
  ports: [{ name: http, port: 8000, targetPort: http }]
