# Sinh 3 app cms-dev, cms-staging, cms-prod tu cung Helm chart
# __REPO_URL__ duoc deploy.sh thay bang URL HTTPS cua repo GitHub
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cms
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
          - env: staging
          - env: prod
  template:
    metadata:
      name: 'cms-{{.env}}'
      finalizers: [resources-finalizer.argocd.argoproj.io]   # xoa app thi xoa luon ALB
    spec:
      project: default
      source:
        repoURL: __REPO_URL__
        targetRevision: eks-lab
        path: cms/helm/cms-chart
        helm:
          valueFiles: ['values-{{.env}}.yaml']
      destination:
        server: https://kubernetes.default.svc
        namespace: 'cms-{{.env}}'
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true]
